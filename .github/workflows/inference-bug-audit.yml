name: Inference bug audit

on:
  push:
    branches: [fix/inference-numerical-stability]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Archive tracked source for local regression tests
        run: git archive --format=tar.gz --output=source-snapshot.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: inference-audit-source
          path: source-snapshot.tar.gz
          retention-days: 3
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install core development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run core test suite
        run: python -m pytest -q --junitxml=inference-audit-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inference-audit-tests
          path: inference-audit-tests.xml
          if-no-files-found: ignore
          retention-days: 3
